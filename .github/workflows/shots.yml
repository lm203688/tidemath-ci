name: shots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Prebuild
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Build simulator app
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild build -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -25
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | tee "$RUNNER_TEMP/bundle.txt"

      - name: Shoot phone and iPad
        run: |
          set +e
          BUNDLE=$(cat "$RUNNER_TEMP/bundle.txt")
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          mkdir -p out
          shoot() {
            NAME="$1"; TYPE="$2"
            UDID=$(xcrun simctl create "$NAME" "$TYPE" com.apple.CoreSimulator.SimRuntime.iOS-27-1)
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE" > "$RUNNER_TEMP/$NAME.log" 2>&1 &
            sleep 40
            xcrun simctl io "$UDID" screenshot "out/$NAME.png"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            tail -5 "$RUNNER_TEMP/$NAME.log" || true
          }
          shoot "iphone-16-pro-max" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max
          shoot "ipad-pro-13-m4" com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB
          ls -l out
          for f in out/*.png; do sips -g pixelWidth -g pixelHeight "$f"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidemath-shots
          path: out
          if-no-files-found: warn
