name: shots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Prebuild
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Build simulator app
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild build -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -25
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | tee "$RUNNER_TEMP/bundle.txt"

      - name: Shoot phone and iPad
        run: |
          set +e
          BUNDLE=$(cat "$RUNNER_TEMP/bundle.txt")
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          echo "bundle=$BUNDLE app=$APP"
          mkdir -p out logs
          shoot() {
            NAME="$1"; TYPE="$2"
            UDID=$(xcrun simctl create "$NAME" "$TYPE" com.apple.CoreSimulator.SimRuntime.iOS-27-0)
            if [ -z "$UDID" ]; then echo "create failed: $NAME $TYPE"; return; fi
            echo "created $NAME udid=$UDID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            sleep 10
            echo "install $NAME:"; xcrun simctl install "$UDID" "$APP"
            for attempt in 1 2 3; do
              echo "launch attempt $attempt for $NAME:"
              xcrun simctl launch "$UDID" "$BUNDLE" 2>&1
              sleep 40
              COUNT=$(xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -c "$BUNDLE")
              echo "running_count=$COUNT"
              if [ "${COUNT:-0}" -gt 0 ]; then break; fi
              echo "not running, retrying"
            done
            sleep 5
            xcrun simctl io "$UDID" screenshot "out/$NAME.png"
            xcrun simctl spawn "$UDID" log show --last 4m --style compact \
              --predicate 'processImagePath CONTAINS "TideMath" OR senderImagePath CONTAINS "TideMath"' \
              2>/dev/null | tail -60 > "logs/$NAME-app.log" || true
            xcrun simctl spawn "$UDID" log show --last 4m --style compact \
              --predicate 'eventMessage CONTAINS "TideMath"' 2>/dev/null | tail -60 > "logs/$NAME-sys.log" || true
            ls -1t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 > "logs/$NAME-crash-index.txt" || true
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
          }
          shoot "iphone-16-pro-max" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max
          shoot "ipad-pro-13-m4" com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB
          ls -l out logs
          for f in out/*.png; do sips -g pixelWidth -g pixelHeight "$f"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidemath-shots
          path: |
            out
            logs
          if-no-files-found: warn
