name: release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the .ipa to App Store Connect"
        type: boolean
        default: false

env:
  BUNDLE_ID: ${{ vars.TIDEMATH_BUNDLE_ID }}
  TEAM_ID: ${{ vars.TIDEMATH_TEAM_ID }}

jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Unit tests (engine + data bundle)
        run: node --test test/engine.test.mjs

      - name: Sanity-check the bundled station file
        run: |
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("assets/noaa-tides.json","utf8"));
            const r=d.stations.filter(s=>s.t==="R").length;
            const s=d.stations.filter(s=>s.t==="S").length;
            const noHarm=d.stations.filter(s=>s.t==="R"&&(!s.h||!s.h.length)).length;
            console.log("stations",d.stations.length,"ref",r,"sub",s,"ref-without-harmonics",noHarm,"fetched",d.fetched);
            if(noHarm) throw new Error("reference station without harmonics shipped");
            if(r<1000) throw new Error("too few reference stations");
          '

      - name: Install signing certificate
        env:
          P12_B64: ${{ secrets.DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          set -x
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p tmpass build.keychain || true
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p tmpass build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$P12_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k tmpass build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          PROFILE_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
        run: |
          set -x
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          ls -l "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Check the injected sources landed
        run: |
          set -x
          ls ios
          ls ios/AppIntents
          grep -c "AppShortcutsProvider" ios/AppIntents/*.swift
          grep -n "TideMath" ios/*/Info.plist | head -5

      - name: Archive
        env:
          PROFILE_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/tidemath.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -80

      - name: Export ipa
        env:
          PROFILE_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
        run: |
          set -o pipefail
          echo "profile=$PROFILE_UUID bundle=$BUNDLE_ID"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/tidemath.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -60
          ls -l "$RUNNER_TEMP/ipa" || true

      - name: Verify ipa contents
        run: |
          set -x
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          rm -rf "$RUNNER_TEMP/ipa-x" && mkdir -p "$RUNNER_TEMP/ipa-x"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-x"
          APP=$(find "$RUNNER_TEMP/ipa-x/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          plutil -p "$APP/Info.plist" | grep -Ei 'CFBundleIdentifier|CFBundleVersion|CFBundleShortVersionString|UIApplicationSceneManifest' || true
          ls "$APP" | grep -Ei 'noaa|metadata|appintents' || true
          du -sh "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | head -20 || true

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" \
            --verbose 2>&1 | tail -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidemath-release
          path: |
            ${{ runner.temp }}/ipa/**/*.ipa
          if-no-files-found: warn
          retention-days: 7
